        /* Congelar encabezados verticales */
        #tabla-seguimiento thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--gpl-dorado);
            /* Removed outline, using box-shadow for visual separation */
            box-shadow: 0 1px 1px #ccc;
        }

        /* Congelar las 3 primeras columnas horizontales en el THEAD */
        #tabla-seguimiento thead th:nth-child(1) { position: sticky; left: 0; z-index: 15; min-width: 90px; max-width: 90px; background-color: var(--gpl-dorado); border-right: 1px solid #ccc; }
        #tabla-seguimiento thead th:nth-child(2) { position: sticky; left: 90px; z-index: 15; min-width: 220px; max-width: 220px; background-color: var(--gpl-dorado); border-right: 1px solid #ccc; }
        #tabla-seguimiento thead th:nth-child(3) { position: sticky; left: 310px; z-index: 15; min-width: 140px; max-width: 140px; background-color: var(--gpl-dorado); border-right: 1px solid #ccc; }

        /* Congelar las 3 primeras columnas horizontales en el TBODY (Solo filas normales) */
        #tabla-seguimiento tbody tr:not(.row-equipo-total):not(.row-sucursal-total):not(.row-empresa-total) td:nth-child(1) {
            position: sticky; left: 0; z-index: 5; background-color: white; 
        }
        #tabla-seguimiento tbody tr:not(.row-equipo-total):not(.row-sucursal-total):not(.row-empresa-total) td:nth-child(2) {
            position: sticky; left: 90px; z-index: 5; background-color: white;  white-space: normal;
        }
        #tabla-seguimiento tbody tr:not(.row-equipo-total):not(.row-sucursal-total):not(.row-empresa-total) td:nth-child(3) {
            position: sticky; left: 310px; z-index: 5; background-color: white; 
        }

        /* Filas de totales (tienen colspan=3 en la primera celda) */
        #tabla-seguimiento tbody tr.row-empresa-total td:nth-child(1) {
            position: sticky;
            left: 0;
            z-index: 5;
            background-color: #000 !important;
            color: white;
            border-right: 1px solid #ddd;
        }

        #tabla-seguimiento tbody tr.row-equipo-total td:nth-child(1) {
            position: sticky;
            left: 0;

        }
        #tabla-seguimiento tbody tr.row-sucursal-total td:nth-child(1) {
            position: sticky;
            left: 0;
            z-index: 5;
            background-color: #A42A68 !important;
            color: white;
            
        }

    
        .hide-btn {
            cursor: pointer;
            color: #888;
            margin-left: 5px;
            font-size: 10px;
        }
        .hide-btn:hover {
            color: #333;
        }
</style>

    <script>
        const clienteSupabase = supabase.createClient('https://pumpwqyazqaxeeknrhyo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bXB3cXlhenFheGVla25yaHlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjQ4ODEsImV4cCI6MjA5NDIwMDg4MX0.-AQZZYAt-uskDLUpbiafJXbHgW0lErf8bwEnk7eq1DE');

        
        
        function exportarPNG() {
            let tableCont = document.getElementById("contenedor-tabla");
            if (!tableCont) return alert("No hay datos para exportar.");
            
            // Fix overflow and maxHeight to prevent cropping
            let originalMaxHeight = tableCont.style.maxHeight;
            let originalOverflowY = tableCont.style.overflowY;
            let originalOverflowX = tableCont.style.overflowX;
            tableCont.style.maxHeight = 'none';
            tableCont.style.overflowY = 'visible';
            tableCont.style.overflowX = 'visible';

            // html2canvas sometimes needs a small delay to register layout changes
            setTimeout(() => {
                html2canvas(tableCont, { scale: 2, useCORS: true, logging: false }).then(canvas => {
                    // Restore original styles
                    tableCont.style.maxHeight = originalMaxHeight;
                    tableCont.style.overflowY = originalOverflowY;
                    tableCont.style.overflowX = originalOverflowX;

                    let link = document.createElement("a");
                    link.download = "Seguimiento_" + document.getElementById('titulo-campana').innerText.trim() + ".png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                }).catch(err => {
                    console.error(err);
                    tableCont.style.maxHeight = originalMaxHeight;
                    tableCont.style.overflowY = originalOverflowY;
                    tableCont.style.overflowX = originalOverflowX;
                    alert("Error al exportar PNG");
                });
            }, 100);
        }

        function exportarExcel() {
            let table = document.getElementById("tabla-seguimiento");
            if (!table) return alert("No hay datos para exportar.");
            let wb = XLSX.utils.table_to_book(table, {sheet:"Seguimiento"});
            XLSX.writeFile(wb, "Seguimiento_Semanal_" + document.getElementById('titulo-campana').innerText.trim() + ".xlsx");
        }

        async function cargarData() {
            try {
                // Calcular campaña actual
                
                // Traer todas las semanas
                const { data: todasSemanas } = await clienteSupabase
                    .from('semanas_config')
                    .select('*')
                    .order('fecha_inicio', { ascending: true });

                let semanas = [];
                let campanaActual = 'Sin Campaña';
                if (todasSemanas && todasSemanas.length > 0) {
                    // Agrupar por la campaña que tiene la semana más reciente o actual
                    // Simplemente tomamos la campaña de la última semana configurada
                    campanaActual = todasSemanas[todasSemanas.length - 1].campana;
                    semanas = todasSemanas.filter(s => s.campana === campanaActual);
                }

                document.getElementById('titulo-campana').innerText = campanaActual;
                if (!semanas || semanas.length === 0) {
                    document.getElementById('contenedor-tabla').innerHTML = '<div style="text-align:center; padding:50px; color:#aaa; font-size:18px;">No hay semanas configuradas para ' + campanaActual + ' aún. El administrador debe configurarlas en el panel Maestro.</div>';
                    return;
                }

                // Traer catálogos
                                const { data: perfiles } = await clienteSupabase.from('perfiles').select('id, nombre, equipo_id, rol');
                const { data: equipos } = await clienteSupabase.from('equipos').select('id, nombre, agencia_id');
                const { data: agencias } = await clienteSupabase.from('agencias').select('id, nombre, color_hex');
                
                // Poblar filtro de agencias si est vaco
                let selectAgencia = document.getElementById('filtroAgencia');
                if (selectAgencia && selectAgencia.options.length <= 1) {
                    agencias.forEach(a => {
                        let opt = document.createElement('option');
                        opt.value = a.id;
                        opt.textContent = a.nombre;
                        selectAgencia.appendChild(opt);
                    });
                }


                // Traer todas las ventas (paginadas) para no perder ninguna
                let earliestDate = new Date(semanas[0].fecha_inicio + 'T00:00:00');
                let latestDate = new Date(semanas[semanas.length - 1].fecha_fin + 'T23:59:59');
                
                let ventas = [];
                let fromStr = earliestDate.toISOString();
                let toStr = latestDate.toISOString();
                
                let page = 0; let pageSize = 1000; let hasMore = true;
                while(hasMore) {
                    const { data: vPage } = await clienteSupabase
                        .from('registro_ventas')
                        .select('vendedor_id, monto, created_at, es_anulada, ventas_cerradas, bajas')
                        .gte('created_at', fromStr)
                        .lte('created_at', toStr)
                        .range(page * pageSize, (page + 1) * pageSize - 1);
                        
                    if (vPage && vPage.length > 0) {
                        ventas = ventas.concat(vPage);
                        if (vPage.length < pageSize) hasMore = false;
                        else page++;
                    } else hasMore = false;
                }

                // Función auxiliar para saber las ventas netas de un vendedor en una semana específica
                
                // Funciones auxiliares
                const getVentasEnSemana = (vendedorId, fechaIniStr, fechaFinStr) => {
                    let dIni = new Date(fechaIniStr + 'T00:00:00');
                    let dFin = new Date(fechaFinStr + 'T23:59:59');
                    let vts = ventas.filter(v => v.vendedor_id === vendedorId);
                    let vtsEnRango = vts.filter(v => { let d = new Date(v.created_at); return d >= dIni && d <= dFin; });
                    let brutas = vtsEnRango.reduce((sum, v) => sum + Number(v.ventas_cerradas || 0), 0);
                    let bajas = vtsEnRango.reduce((sum, v) => sum + Number(v.bajas || 0), 0);
                    return { brutas, bajas, netas: brutas - bajas };
                };
                
                const getVentasEnDia = (vendedorId, fechaStr) => {
                    let dIni = new Date(fechaStr + 'T00:00:00');
                    let dFin = new Date(fechaStr + 'T23:59:59');
                    let vts = ventas.filter(v => v.vendedor_id === vendedorId);
                    let vtsEnRango = vts.filter(v => { let d = new Date(v.created_at); return d >= dIni && d <= dFin; });
                    let brutas = vtsEnRango.reduce((sum, v) => sum + Number(v.ventas_cerradas || 0), 0);
                    let bajas = vtsEnRango.reduce((sum, v) => sum + Number(v.bajas || 0), 0);
                    return { brutas, bajas, netas: brutas - bajas };
                };

                // Calcular dias por semana
                let diasPorSemana = {};
                semanas.forEach(sem => {
                    let current = new Date(sem.fecha_inicio + 'T00:00:00');
                    let end = new Date(sem.fecha_fin + 'T00:00:00');
                    let dias = [];
                    while(current <= end) {
                        dias.push(current.toISOString().split('T')[0]); // YYYY-MM-DD
                        current.setDate(current.getDate() + 1);
                    }
                    diasPorSemana[sem.id] = dias;
                });

                let matrixHtml = '<table id="tabla-seguimiento"><thead><tr><th>SUCURSAL</th><th>ASESOR/A</th><th>EQUIPO</th>';
                semanas.forEach(sem => {
                    // Crear THs ocultos para cada dia
                    let dNames = ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'];
                    diasPorSemana[sem.id].forEach(dStr => {
                        let objD = new Date(dStr + 'T00:00:00');
                        matrixHtml += '<th class="day-col-'+sem.id+'" style="display:none; background:#d4c49d;">'+dNames[objD.getDay()]+'<br><small>'+dStr.substring(8,10)+'/'+dStr.substring(5,7)+'</small></th>';
                    });
                    matrixHtml += '<th class="th-semana" style="cursor:pointer;" onclick="toggleSemana(\'' + sem.id + '\')">' + sem.nombre_semana + ' <i id="icon-sem-'+sem.id+'" class="fa-solid fa-square-plus"></i><br><small>(Obj: ' + sem.objetivo + ')</small></th>';
                });
                matrixHtml += '<th class="th-totales col-ventas" style="border-left:3px solid #ccc !important;">Ventas <i class="fa-solid fa-eye-slash hide-btn" onclick="toggleCol(\'col-ventas\')" title="Ocultar"></i></th><th class="th-totales col-bajas" style="color:#e74c3c;">Bajas <i class="fa-solid fa-eye-slash hide-btn" onclick="toggleCol(\'col-bajas\')" title="Ocultar"></i></th><th class="th-totales col-netas">Ventas Netas <i class="fa-solid fa-eye-slash hide-btn" onclick="toggleCol(\'col-netas\')" title="Ocultar"></i></th><th class="th-totales col-monto">Monto Vendido <i class="fa-solid fa-eye-slash hide-btn" onclick="toggleCol(\'col-monto\')" title="Ocultar"></i></th></tr></thead><tbody>';

                let filtroAgenciaId = document.getElementById('filtroAgencia') ? document.getElementById('filtroAgencia').value : 'todas';
                let validEquipos = equipos.filter(eq => {
                    if (filtroAgenciaId !== 'todas' && eq.agencia_id !== filtroAgenciaId) return false;
                    let vends = perfiles.filter(p => {
                        if (p.equipo_id !== eq.id) return false;
                        if (p.nombre.includes('(BAJA)')) {
                            let mis = ventas.filter(vent => vent.vendedor_id === p.id);
                            let mTot = mis.reduce((sum, vent) => sum + Number(vent.ventas_cerradas || 0) - Number(vent.bajas || 0), 0);
                            if (mTot <= 0) return false;
                        }
                        return true;
                    });
                    return vends.length > 0;
                });

                
                validEquipos.sort((a, b) => {
                    let agA = agencias.find(ag => ag.id === a.agencia_id);
                    let agB = agencias.find(ag => ag.id === b.agencia_id);
                    let nombreA = agA ? agA.nombre : '';
                    let nombreB = agB ? agB.nombre : '';
                    if (nombreA < nombreB) return -1;
                    if (nombreA > nombreB) return 1;
                    if (a.nombre < b.nombre) return -1;
                    if (a.nombre > b.nombre) return 1;
                    return 0;
                });

                let totalesAgencia = { brutas: 0, bajas: 0, netas: 0, monto: 0 };
                let agSemTotals = Array(semanas.length).fill(0).map(() => ({ brutas: 0, bajas: 0, netas: 0 }));
                let agDayTotals = {};
                
                let totalesEmpresa = { brutas: 0, bajas: 0, netas: 0, monto: 0 };
                let empSemTotals = Array(semanas.length).fill(0).map(() => ({ brutas: 0, bajas: 0, netas: 0 }));
                let empDayTotals = {};
                
                semanas.forEach(sem => { 
                    agDayTotals[sem.id] = Array(diasPorSemana[sem.id].length).fill(0).map(() => ({ brutas: 0, bajas: 0, netas: 0 }));
                    empDayTotals[sem.id] = Array(diasPorSemana[sem.id].length).fill(0).map(() => ({ brutas: 0, bajas: 0, netas: 0 }));
                });
                
                validEquipos.forEach((eq, index) => {
                    let agencia = agencias.find(a => a.id === eq.agencia_id);
                    let nombreAgencia = agencia ? agencia.nombre : 'Desconocida';
                    
                    let vendsEquipo = perfiles.filter(p => {
                        if (p.equipo_id !== eq.id) return false;
                        if (p.nombre.includes('(BAJA)')) {
                            let misVentas = ventas.filter(vent => vent.vendedor_id === p.id);
                            let miTotalVentas = misVentas.reduce((sum, vent) => sum + Number(vent.ventas_cerradas || 0) - Number(vent.bajas || 0), 0);
                            if (miTotalVentas <= 0) return false;
                        }
                        return true;
                    });

                    
                    vendsEquipo.sort((a, b) => {
                        let vA = ventas.filter(vent => vent.vendedor_id === a.id);
                        let netasA = vA.reduce((sum, vent) => sum + Number(vent.ventas_cerradas || 0) - Number(vent.bajas || 0), 0);
                        
                        let vB = ventas.filter(vent => vent.vendedor_id === b.id);
                        let netasB = vB.reduce((sum, vent) => sum + Number(vent.ventas_cerradas || 0) - Number(vent.bajas || 0), 0);
                        
                        if (netasA > netasB) return -1;
                        if (netasA < netasB) return 1;
                        
                        if (a.nombre < b.nombre) return -1;
                        if (a.nombre > b.nombre) return 1;
                        return 0;
                    });
                    let totalEqBrutas = 0;
                    let totalEqBajas = 0;
                    let totalEqNetas = 0;
                    let totalEqMonto = 0;
                    let semTotals = Array(semanas.length).fill(0).map(() => ({ brutas: 0, bajas: 0, netas: 0 }));
                    let dayEqTotals = {}; 
                    semanas.forEach(sem => { dayEqTotals[sem.id] = Array(diasPorSemana[sem.id].length).fill(0).map(() => ({ brutas: 0, bajas: 0, netas: 0 })); });

                    let agColor = agencia && agencia.color_hex ? agencia.color_hex : '#ddd';
                    let tdStyle = 'border-right: 2px solid ' + agColor + '; border-bottom: 2px solid ' + agColor + ';';
                    
                    vendsEquipo.forEach(v => {
                        let misVentas = ventas.filter(vent => vent.vendedor_id === v.id);
                        let miBrutas = misVentas.reduce((sum, vent) => sum + Number(vent.ventas_cerradas || 0), 0);
                        let miBajas = misVentas.reduce((sum, vent) => sum + Number(vent.bajas || 0), 0);
                        let miNetas = miBrutas - miBajas;
                        let miTotalMonto = misVentas.reduce((sum, vent) => sum + Number(vent.monto || 0), 0);

                        totalEqBrutas += miBrutas;
                        totalEqBajas += miBajas;
                        totalEqNetas += miNetas;
                        totalEqMonto += miTotalMonto;

                        matrixHtml += '<tr>';
                        matrixHtml += '<td class="td-sucursal" style="'+tdStyle+'">' + nombreAgencia + '</td>';
                        let nombreMostrar = v.nombre;
                        if (v.rol && v.rol !== 'Vendedor') {
                            nombreMostrar += ' <span style="font-size:0.8em; color:#666;">(Líder)</span>';
                        }
                        
                        matrixHtml += '<td class="td-asesor" style="'+tdStyle+'">' + nombreMostrar + '</td>';
                        matrixHtml += '<td style="'+tdStyle+'">' + eq.nombre + '</td>';

                        semanas.forEach((sem, idx) => {
                            let vSem = getVentasEnSemana(v.id, sem.fecha_inicio, sem.fecha_fin);
                            semTotals[idx].brutas += vSem.brutas;
                            semTotals[idx].bajas += vSem.bajas;
                            semTotals[idx].netas += vSem.netas;
                            
                            let colorClass = 'color-red';
                            if (sem.objetivo === 0) colorClass = '';
                            else if (vSem.netas >= sem.objetivo) colorClass = 'color-green';
                            else if (vSem.netas > 0) colorClass = 'color-yellow';
                            
                            // Celdas diarias
                            diasPorSemana[sem.id].forEach((dStr, dIdx) => {
                                let vDia = getVentasEnDia(v.id, dStr);
                                dayEqTotals[sem.id][dIdx].brutas += vDia.brutas;
                                dayEqTotals[sem.id][dIdx].bajas += vDia.bajas;
                                dayEqTotals[sem.id][dIdx].netas += vDia.netas;
                                
                                let displayDia = '';
                                if (vDia.brutas > 0) displayDia += vDia.brutas;
                                if (vDia.bajas > 0) {
                                    if (displayDia !== '') displayDia += ' ';
                                    displayDia += '<span style="color:#e74c3c; font-weight:bold;">(-' + vDia.bajas + ')</span>';
                                }
                                if (displayDia === '') displayDia = '-';
                                
                                matrixHtml += '<td class="day-col-'+sem.id+'" style="display:none; '+tdStyle+' font-size:12px; color:#555;">' + displayDia + '</td>';
                            });
                            
                            let displaySem = '';
                            if (vSem.brutas > 0) displaySem += vSem.brutas;
                            if (vSem.bajas > 0) {
                                if (displaySem !== '') displaySem += ' ';
                                displaySem += '<span style="color:#c0392b; font-weight:bold;">(-' + vSem.bajas + ')</span>';
                            }
                            if (displaySem === '') displaySem = '0';
                            
                            matrixHtml += '<td class="obj-cell ' + colorClass + '" style="'+tdStyle+'">' + displaySem + '</td>';
                        });

                        matrixHtml += '<td class="col-ventas" style="font-weight:bold; background-color:#f1f5f9; font-size:13px; border-left:3px solid #ccc !important; ' + tdStyle + '">' + miBrutas + '</td>';
                        matrixHtml += '<td class="col-bajas" style="font-weight:bold; color:#e74c3c; background-color:#fdf2f2; font-size:13px; ' + tdStyle + '">' + miBajas + '</td>';
                        matrixHtml += '<td class="col-netas" style="font-weight:bold; background-color:#f0fdf4; font-size:13px; ' + tdStyle + '">' + miNetas + '</td>';
                        matrixHtml += '<td class="col-monto" style="' + tdStyle + '">$' + miTotalMonto.toLocaleString('es-AR') + '</td>';
                        matrixHtml += '</tr>';
                    });

                    // Fila Total Equipo
                    matrixHtml += '<tr class="row-equipo-total">';
                    matrixHtml += '<td colspan="3" style="text-align:center; ' + tdStyle + ' border-top:none;">TOTAL EQUIPO ' + eq.nombre.toUpperCase() + '</td>';
                    semanas.forEach((sem, idx) => {
                        diasPorSemana[sem.id].forEach((dStr, dIdx) => {
                             let vTot = dayEqTotals[sem.id][dIdx];
                             let displayDia = '';
                             if (vTot.brutas > 0) displayDia += vTot.brutas;
                             if (vTot.bajas > 0) {
                                 if (displayDia !== '') displayDia += ' ';
                                 displayDia += '<span style="color:#ffcccc; font-weight:bold;">(-' + vTot.bajas + ')</span>';
                             }
                             if (displayDia === '') displayDia = '-';
                             matrixHtml += '<td class="day-col-'+sem.id+'" style="display:none; '+tdStyle+' border-top:none; font-size:12px; color:#fff;">' + displayDia + '</td>';
                        });
                        
                        let vSem = semTotals[idx];
                        let displaySem = '';
                        if (vSem.brutas > 0) displaySem += vSem.brutas;
                        if (vSem.bajas > 0) {
                            if (displaySem !== '') displaySem += ' ';
                            displaySem += '<span style="color:#ffcccc; font-weight:bold;">(-' + vSem.bajas + ')</span>';
                        }
                        if (displaySem === '') displaySem = '0';
                        
                        matrixHtml += '<td style="' + tdStyle + ' border-top:none;">' + displaySem + '</td>';
                    });
                    matrixHtml += '<td class="col-ventas" style="border-left:3px solid #ccc !important; ' + tdStyle + ' border-top:none;">' + totalEqBrutas + '</td>';
                    matrixHtml += '<td class="col-bajas" style="' + tdStyle + ' border-top:none; color:#ffcccc;">' + totalEqBajas + '</td>';
                    matrixHtml += '<td class="col-netas" style="' + tdStyle + ' border-top:none;">' + totalEqNetas + '</td>';
                    matrixHtml += '<td class="col-monto" style="' + tdStyle + ' border-top:none;">$' + totalEqMonto.toLocaleString('es-AR') + '</td>';
                    matrixHtml += '</tr>';
                    
                    // ACCUMULATE INTO TOTAL SUCURSAL
                    totalesAgencia.brutas += totalEqBrutas;
                    totalesAgencia.bajas += totalEqBajas;
                    totalesAgencia.netas += totalEqNetas;
                    totalesAgencia.monto += totalEqMonto;
                    
                    semanas.forEach((sem, idx) => {
                        agSemTotals[idx].brutas += semTotals[idx].brutas;
                        agSemTotals[idx].bajas += semTotals[idx].bajas;
                        agSemTotals[idx].netas += semTotals[idx].netas;
                        diasPorSemana[sem.id].forEach((dStr, dIdx) => {
                            agDayTotals[sem.id][dIdx].brutas += dayEqTotals[sem.id][dIdx].brutas;
                            agDayTotals[sem.id][dIdx].bajas += dayEqTotals[sem.id][dIdx].bajas;
                            agDayTotals[sem.id][dIdx].netas += dayEqTotals[sem.id][dIdx].netas;
                        });
                    });

                    // IS IT THE LAST TEAM FOR THIS SUCURSAL?
                    let isLastForAgencia = true;
                    if (index < validEquipos.length - 1) {
                        if (validEquipos[index + 1].agencia_id === eq.agencia_id) {
                            isLastForAgencia = false;
                        }
                    }

                    if (isLastForAgencia) {
                        let darkBg = '#A42A68'; // Match the user's header/total color
                        let borderStyle = 'border-right: 2px solid ' + agColor + '; border-bottom: 2px solid ' + agColor + ';';
                        matrixHtml += '<tr class="row-sucursal-total" style="background-color: ' + darkBg + '; color: white; font-weight: bold;">';
                        matrixHtml += '<td colspan="3" style="text-align:center; ' + borderStyle + '">TOTAL SUCURSAL ' + nombreAgencia.toUpperCase() + '</td>';
                        semanas.forEach((sem, idx) => {
                            diasPorSemana[sem.id].forEach((dStr, dIdx) => {
                                 let vTot = agDayTotals[sem.id][dIdx];
                                 let displayDia = '';
                                 if (vTot.brutas > 0) displayDia += vTot.brutas;
                                 if (vTot.bajas > 0) {
                                     if (displayDia !== '') displayDia += ' ';
                                     displayDia += '<span style="color:#ffcccc; font-weight:bold;">(-' + vTot.bajas + ')</span>';
                                 }
                                 if (displayDia === '') displayDia = '-';
                                 matrixHtml += '<td class="day-col-'+sem.id+'" style="display:none; '+borderStyle+' font-size:12px; color:#fff;">' + displayDia + '</td>';
                            });
                            
                            let vSem = agSemTotals[idx];
                            let displaySem = '';
                            if (vSem.brutas > 0) displaySem += vSem.brutas;
                            if (vSem.bajas > 0) {
                                if (displaySem !== '') displaySem += ' ';
                                displaySem += '<span style="color:#ffcccc; font-weight:bold;">(-' + vSem.bajas + ')</span>';
                            }
                            if (displaySem === '') displaySem = '0';
                            
                            matrixHtml += '<td style="' + borderStyle + '">' + displaySem + '</td>';
                        });
                        matrixHtml += '<td class="col-ventas" style="border-left:3px solid #ccc !important; ' + borderStyle + '">' + totalesAgencia.brutas + '</td>';
                        matrixHtml += '<td class="col-bajas" style="' + borderStyle + '; color:#ffcccc;">' + totalesAgencia.bajas + '</td>';
                        matrixHtml += '<td class="col-netas" style="' + borderStyle + '">' + totalesAgencia.netas + '</td>';
                        matrixHtml += '<td class="col-monto" style="' + borderStyle + '">$' + totalesAgencia.monto.toLocaleString('es-AR') + '</td>';
                        matrixHtml += '</tr>';
                        
                        // Accumulate into Empresa
                        totalesEmpresa.brutas += totalesAgencia.brutas;
                        totalesEmpresa.bajas += totalesAgencia.bajas;
                        totalesEmpresa.netas += totalesAgencia.netas;
                        totalesEmpresa.monto += totalesAgencia.monto;
                        
                        semanas.forEach((sem, idx) => {
                            empSemTotals[idx].brutas += agSemTotals[idx].brutas;
                            empSemTotals[idx].bajas += agSemTotals[idx].bajas;
                            empSemTotals[idx].netas += agSemTotals[idx].netas;
                            diasPorSemana[sem.id].forEach((dStr, dIdx) => {
                                empDayTotals[sem.id][dIdx].brutas += agDayTotals[sem.id][dIdx].brutas;
                                empDayTotals[sem.id][dIdx].bajas += agDayTotals[sem.id][dIdx].bajas;
                                empDayTotals[sem.id][dIdx].netas += agDayTotals[sem.id][dIdx].netas;
                            });
                        });

                        // Reset accumulators for next branch
                        totalesAgencia = { brutas: 0, bajas: 0, netas: 0, monto: 0 };
                        agSemTotals = Array(semanas.length).fill(0).map(() => ({ brutas: 0, bajas: 0, netas: 0 }));
                        semanas.forEach(sem => { agDayTotals[sem.id] = Array(diasPorSemana[sem.id].length).fill(0).map(() => ({ brutas: 0, bajas: 0, netas: 0 })); });
                    }
                });
                
                // FINAL: TOTAL EMPRESA ROW
                let empStyle = 'border-right: 2px solid #ccc; border-bottom: 2px solid #ccc;';
                matrixHtml += '<tr class="row-empresa-total" style="background-color: #000; color: #fff; font-weight: bold; font-size: 14px;">';
                matrixHtml += '<td colspan="3" style="text-align:center; ' + empStyle + '">TOTAL EMPRESA</td>';
                semanas.forEach((sem, idx) => {
                    diasPorSemana[sem.id].forEach((dStr, dIdx) => {
                         let vTot = empDayTotals[sem.id][dIdx];
                         let displayDia = '';
                         if (vTot.brutas > 0) displayDia += vTot.brutas;
                         if (vTot.bajas > 0) {
                             if (displayDia !== '') displayDia += ' ';
                             displayDia += '<span style="color:#ffcccc; font-weight:bold;">(-' + vTot.bajas + ')</span>';
                         }
                         if (displayDia === '') displayDia = '-';
                         matrixHtml += '<td class="day-col-'+sem.id+'" style="display:none; '+empStyle+' color:#fff;">' + displayDia + '</td>';
                    });
                    
                    let vSem = empSemTotals[idx];
                    let displaySem = '';
                    if (vSem.brutas > 0) displaySem += vSem.brutas;
                    if (vSem.bajas > 0) {
                        if (displaySem !== '') displaySem += ' ';
                        displaySem += '<span style="color:#ffcccc; font-weight:bold;">(-' + vSem.bajas + ')</span>';
                    }
                    if (displaySem === '') displaySem = '0';
                    
                    matrixHtml += '<td style="' + empStyle + '">' + displaySem + '</td>';
                });
                matrixHtml += '<td class="col-ventas" style="border-left:3px solid #ccc !important; ' + empStyle + '">' + totalesEmpresa.brutas + '</td>';
                matrixHtml += '<td class="col-bajas" style="' + empStyle + '; color:#ffcccc;">' + totalesEmpresa.bajas + '</td>';
                matrixHtml += '<td class="col-netas" style="' + empStyle + '">' + totalesEmpresa.netas + '</td>';
                matrixHtml += '<td class="col-monto" style="' + empStyle + '">$' + totalesEmpresa.monto.toLocaleString('es-AR') + '</td>';
                matrixHtml += '</tr>';

                matrixHtml += '</tbody></table>';
                document.getElementById('contenedor-tabla').innerHTML = matrixHtml;

            } catch (err) {
                document.getElementById('contenedor-tabla').innerHTML = '<div style="color:red; text-align:center; padding:50px;">ERROR: ' + err.message + '</div>';
            }
        }

        
        
        window.toggleCol = function(className) {
            let cols = document.querySelectorAll('.' + className);
            let icon = document.querySelector('.' + className + ' .hide-btn');
            
            // Determine if we are hiding or showing based on the first cell
            let isHidden = cols.length > 0 && cols[0].style.display === 'none';
            
            cols.forEach(c => c.style.display = isHidden ? 'table-cell' : 'none');
            
            if(icon) {
                icon.className = isHidden ? 'fa-solid fa-eye-slash hide-btn' : 'fa-solid fa-eye hide-btn';
            }
        };

        window.toggleSemana = function(id) {
            let cols = document.querySelectorAll('.day-col-' + id);
            let icon = document.getElementById('icon-sem-' + id);
            let isHidden = cols[0].style.display === 'none';
            cols.forEach(c => c.style.display = isHidden ? 'table-cell' : 'none');
            if(icon) {
                icon.className = isHidden ? 'fa-solid fa-square-minus' : 'fa-solid fa-square-plus';
            }
        };

        window.onload = cargarData;

    </script>
</body>
