<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal GPL - Grupo ProLíder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gpl-petroleo: #006779;
            --gpl-dorado: #A42A68;
            --fondo-oscuro: #121a1f;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--fondo-oscuro) 0%, #061117 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            box-sizing: border-box;
            color: #333;
        }

        .login-box {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 90%;
            max-width: 380px;
            border-top: 6px solid var(--gpl-dorado);
            margin: auto;
            animation: containerFade 0.5s ease;
        }

        @keyframes containerFade {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box img {
            max-width: 160px;
            margin-bottom: 15px;
        }

        .login-box h1 {
            margin: 0 0 5px 0;
            color: var(--gpl-petroleo);
            font-size: 20px;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .login-box p {
            color: #666;
            font-size: 11px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .seccion-acceso {
            background: #f4f7f8;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #e1e8ea;
            text-align: left;
        }

        .seccion-acceso h3 {
            margin: 0 0 10px 0;
            font-size: 11px;
            color: var(--gpl-petroleo);
            text-transform: uppercase;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select,
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn-entrar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            box-sizing: border-box;
            border: none;
        }

        .btn-vendedor {
            background: var(--gpl-petroleo);
            color: white;
            box-shadow: 0 3px 10px rgba(10, 58, 70, 0.2);
        }

        .btn-vendedor:hover {
            background: #061e24;
        }

        .btn-gerente {
            background: #27ae60;
            color: white;
            box-shadow: 0 3px 10px rgba(39, 174, 96, 0.2);
        }

        .btn-gerente:hover {
            background: #1e7e34;
        }

        .btn-admin {
            background: #e74c3c;
            color: white;
            box-shadow: 0 3px 10px rgba(231, 76, 60, 0.2);
        }

        .btn-admin:hover {
            background: #c0392b;
        }

        .footer-txt {
            margin-top: 20px;
            font-size: 10px;
            color: #999;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* RANKING DIARIO INDEX */
        .ranking-diario-wrapper { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .ranking-diario-caja { flex: 1; background: rgba(255, 255, 255, 0.9); border-radius: 12px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 4px solid var(--gpl-dorado); text-align: left; }
        .ranking-diario-caja.entrevistas { border-top-color: #3498db; }
        .ranking-diario-titulo { font-size: 11px; font-weight: 900; text-transform: uppercase; color: var(--gpl-petroleo); margin-bottom: 8px; text-align: center; }
        .ranking-diario-lista { max-height: 110px; overflow-y: auto; padding-right: 5px; }
        .ranking-diario-lista::-webkit-scrollbar { width: 4px; }
        .ranking-diario-lista::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .ranking-diario-lista::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .ranking-diario-item { display: flex; justify-content: space-between; font-size: 11px; padding: 5px 0; border-bottom: 1px solid #eee; }
        .ranking-diario-item:last-child { border-bottom: none; }
        .ranking-diario-nombre { font-weight: bold; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
        .ranking-diario-valor { font-weight: 900; color: var(--gpl-dorado); }
        .ranking-diario-caja.entrevistas .ranking-diario-valor { color: #3498db; }
        .ranking-diario-vacio { font-size: 10px; color: #888; text-align: center; padding: 10px 0; font-style: italic; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#A42A68">
    <link rel="apple-touch-icon" href="LOGO-gpl.png">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>

    <!-- Configuración para iOS Safari (iPhone/iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Suite GPL">
</head>

<body>

    <div class="login-box">
        <img src="LOGO-gpl.png" alt="GPL">
        <h1>Suite Comercial v3.0</h1>
        <p>Sistema de Control de Ventas</p>

        <button onclick="window.location.href='competencias.html'" style="width:100%; margin:15px 0 10px 0; padding:15px; background:linear-gradient(45deg, #f1c40f, #e67e22); color:white; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; box-shadow: 0 4px 15px rgba(241,196,15,0.4);"><i class="fa-solid fa-trophy"></i> VER COMPETENCIAS ACTIVAS</button>

        <!-- TOP 10 ENTREVISTAS DEL DÍA -->
        <div class="ranking-diario-wrapper" style="margin: 5px 0 15px 0;">
            <div class="ranking-diario-caja entrevistas" style="border-top: 4px solid #14596b; background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 12px 14px; box-shadow: 0 4px 15px rgba(10,58,70,0.12);">
                <div class="ranking-diario-titulo" style="font-size: 12px; font-weight: 800; color: #0a3a46; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; padding-bottom: 6px;">
                    <span style="display: flex; align-items: center; gap: 6px;">
                        <i class="fa-solid fa-trophy" style="color: #f1c40f;"></i> TOP 10 ENTREVISTAS DE HOY
                    </span>
                    <span id="txtFechaTop10" style="font-size: 10px; font-weight: 600; color: #7f8c8d; text-transform: none;"></span>
                </div>
                <div class="ranking-diario-lista" id="listaTop10Entrevistas" style="max-height: 320px; overflow-y: auto; padding-right: 4px;">
                    <div class="ranking-diario-vacio" style="padding: 15px 10px; color: #888; font-size: 11px; text-align: center;">
                        <i class="fa-solid fa-spinner fa-spin" style="margin-right: 6px;"></i> Cargando mejores del día...
                    </div>
                </div>
            </div>
        </div>


        <div class="seccion-acceso">
            <h3><i class="fa-solid fa-user"></i> Acceso Personal de Ventas</h3>
            <select id="selectVendedor">
                <option value="">-- Buscá tu Nombre --</option>
            </select>
            <input type="password" id="passVendedor" placeholder="Tu PIN de 4 dígitos">
            <button onclick="ingresarVendedor()" id="btnIngresoVend" class="btn-entrar btn-vendedor">
                <i class="fa-solid fa-right-to-bracket"></i> Ingresar a mi Panel
            </button>
        </div>

        <div class="seccion-acceso" style="background: #fafffb; border-color: #c3e6cb;">
            <h3 style="color: #1e7e34;"><i class="fa-solid fa-chart-line"></i> Acceso Gerencia Comercial</h3>
            <input type="password" id="passGerente" placeholder="PIN Gerencial Comercial">
            <button onclick="ingresarGerente()" class="btn-entrar btn-gerente">
                <i class="fa-solid fa-file-excel"></i> Ver Rankings y Descargar Excel
            </button>
        </div>

        <div class="seccion-acceso">
            <h3><i class="fa-solid fa-lock"></i> Panel Maestro (Sistemas)</h3>
            <input type="password" id="passAdmin" placeholder="Ingresá el PIN Maestro">
            <button onclick="ingresarAdmin()" class="btn-entrar btn-admin">
                <i class="fa-solid fa-shield-halved"></i> Control Maestro
            </button>
        </div>

        <div class="seccion-acceso" style="background: #fff8eb; border-color: #f39c12;">
            <h3 style="color: #d35400;"><i class="fa-solid fa-headset"></i> Encuestas de Calidad y Entrevistas</h3>
            <button onclick="window.location.href='panel_auditoria_entrevistas.html'" class="btn-entrar" style="background:#e67e22;">
                <i class="fa-solid fa-file-audio"></i> Ingresar a Auditoría
            </button>
        </div>

        <div class="footer-txt">Grupo ProLíder Comercial</div>
    </div>

    <script>
        function obtenerFechaLocal(fechaParam) {
            const d = fechaParam ? new Date(fechaParam) : new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        window.mapaVendedores = {};
        const clienteSupabase = supabase.createClient('https://pumpwqyazqaxeeknrhyo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bXB3cXlhenFheGVla25yaHlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjQ4ODEsImV4cCI6MjA5NDIwMDg4MX0.-AQZZYAt-uskDLUpbiafJXbHgW0lErf8bwEnk7eq1DE');

        async function cargarListaVendedores() {
            try {
                let allData = [];
                let step = 1000, fromRow = 0;
                while (true) {
                    const { data, error } = await clienteSupabase.from('perfiles').select('id, nombre').order('nombre').range(fromRow, fromRow + step - 1);
                    if (error) throw error;
                    if (!data || data.length === 0) break;
                    allData = allData.concat(data);
                    if (data.length < step) break;
                    fromRow += step;
                }
                const data = allData;

                const select = document.getElementById('selectVendedor');
                if (data) {
                    data.forEach(p => {
                        // Ocultar vendedores dados de baja del menú desplegable
                        if (p.nombre.toUpperCase().includes('(BAJA)') || p.nombre.toUpperCase().includes('(OCULTO)')) return;
                        
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.nombre;
                        select.appendChild(opt);
                        window.mapaVendedores[p.id] = p.nombre;
                    });
                }
            } catch (err) {
                console.error("Error cargando personal:", err.message);
            }
        }

        async function ingresarVendedor() {
            const idVendedor = document.getElementById('selectVendedor').value;
            const pinIngresado = document.getElementById('passVendedor').value;
            const btn = document.getElementById('btnIngresoVend');

            if (!idVendedor) return alert("Por favor, seleccioná tu nombre en la lista.");
            if (!pinIngresado) return alert("Por favor, ingresá tu PIN de seguridad.");

            btn.textContent = "Verificando...";
            btn.disabled = true;

            try {
                const { data, error } = await clienteSupabase.from('perfiles').select('pin_acceso, rol').eq('id', idVendedor).single();
                if (error) throw error;

                if (data.pin_acceso === pinIngresado) {
                    sessionStorage.setItem('gpl_usuario_id', idVendedor);
                    localStorage.setItem('gpl_usuario_id', idVendedor);
                    sessionStorage.setItem('gpl_usuario_rol', data.rol || '');
                    localStorage.setItem('gpl_usuario_rol', data.rol || '');

                    const rol = (data.rol || '').toLowerCase();
                    if (rol === 'lider' || rol === 'líder' || rol === 'líder de asesores' || rol === 'lider de asesores') {
                        window.location.href = `panel_lider.html?id=${idVendedor}`;
                    } else if (rol === 'líder de sucursal') {
                        window.location.href = `panel_supervisor.html?id=${idVendedor}`;
                    } else if (rol === 'líder de equipos') {
                        window.location.href = `panel_coordinador.html?id=${idVendedor}`;
                    } else if (rol === 'gerencia' || rol === 'gerente') {
                        window.location.href = `panel_gerencia.html`;
                    } else {
                        window.location.href = `panel_vendedor.html?id=${idVendedor}`;
                    }
                } else {
                    alert("PIN incorrecto. Intentalo de nuevo.");
                    document.getElementById('passVendedor').value = '';
                }
            } catch (err) {
                alert("Hubo un error al verificar la identidad.");
                console.error(err);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Ingresar a mi Panel';
                btn.disabled = false;
            }
        }

        function ingresarGerente() {
            const pin = document.getElementById('passGerente').value;
            // Claves exclusivas para Gerencia Comercial
            if (pin === 'gplgerente' || pin === '5678') {
                sessionStorage.setItem('gpl_usuario_rol', 'Gerencia');
                localStorage.setItem('gpl_usuario_rol', 'Gerencia');
                sessionStorage.removeItem('gpl_usuario_id');
                localStorage.removeItem('gpl_usuario_id');
                window.location.href = 'panel_gerencia.html';
            } else {
                alert("PIN Gerencial incorrecto. Acceso denegado.");
                document.getElementById('passGerente').value = '';
            }
        }

        function ingresarAdmin() {
            const pin = document.getElementById('passAdmin').value;
            if (pin === 'gpl2026' || pin === '1234') {
                window.location.href = 'admin_master.html';
            } else {
                alert("PIN maestro incorrecto. Acceso denegado.");
                document.getElementById('passAdmin').value = '';
            }
        }

        function esCuentaExcluidaTop10(nombre) {
            if (!nombre) return true;
            const nom = nombre.toUpperCase().trim();
            return nom === 'AGUERO FRANCO' || 
                   nom === 'FRANCO AGUERO' || 
                   nom.includes('ZPRUEBA') || 
                   nom.includes('(PRUEBA)') || 
                   nom.includes('(BAJA)') || 
                   nom.includes('(OCULTO)');
        }

        async function cargarTop10Entrevistas() {
            const contenedor = document.getElementById('listaTop10Entrevistas');
            const txtFecha = document.getElementById('txtFechaTop10');
            if (txtFecha) {
                txtFecha.textContent = new Date().toLocaleDateString('es-AR');
            }
            if (!contenedor) return;

            try {
                // Consultar registros desde el inicio del día anterior para asegurar sincronización horaria
                const d = new Date();
                d.setDate(d.getDate() - 1);
                d.setHours(0, 0, 0, 0);

                const [resEntrevistas, resPerfiles] = await Promise.all([
                    clienteSupabase
                        .from('registro_entrevistas')
                        .select('id, vendedor_id, created_at')
                        .gte('created_at', d.toISOString()),
                    clienteSupabase
                        .from('perfiles')
                        .select('id, nombre')
                ]);

                if (resEntrevistas.error) throw resEntrevistas.error;
                if (resPerfiles.error) throw resPerfiles.error;

                const mapaNombres = {};
                (resPerfiles.data || []).forEach(p => { mapaNombres[p.id] = p.nombre; });

                const hoyStr = new Date().toLocaleDateString('es-AR');
                const entrevistasHoy = (resEntrevistas.data || []).filter(e => {
                    return e.created_at && new Date(e.created_at).toLocaleDateString('es-AR') === hoyStr;
                });

                const conteos = {};
                entrevistasHoy.forEach(e => {
                    if (!e.vendedor_id) return;
                    conteos[e.vendedor_id] = (conteos[e.vendedor_id] || 0) + 1;
                });

                const ranking = [];
                Object.keys(conteos).forEach(vId => {
                    const nom = mapaNombres[vId] || 'Asesor';
                    if (esCuentaExcluidaTop10(nom)) return;
                    const total = conteos[vId];
                    if (total > 0) {
                        ranking.push({ id: vId, nombre: nom, total: total });
                    }
                });

                // Ordenar descendentemente: los mejores primero
                ranking.sort((a, b) => {
                    if (b.total !== a.total) return b.total - a.total;
                    return a.nombre.localeCompare(b.nombre);
                });

                const top10 = ranking.slice(0, 10);

                if (top10.length === 0) {
                    contenedor.innerHTML = `
                        <div class="ranking-diario-vacio" style="padding: 16px 10px; color: #7f8c8d; font-size: 11px; text-align: center;">
                            <i class="fa-solid fa-calendar-day" style="font-size: 20px; margin-bottom: 6px; opacity: 0.5; display: block; color: #14596b;"></i>
                            Aún no hay entrevistas registradas hoy.
                        </div>
                    `;
                    return;
                }

                let html = '';
                top10.forEach((item, idx) => {
                    let posIcon = `#${idx + 1}`;
                    let medallaColor = '#555';
                    if (idx === 0) { posIcon = '🥇'; medallaColor = '#d4af37'; }
                    else if (idx === 1) { posIcon = '🥈'; medallaColor = '#95a5a6'; }
                    else if (idx === 2) { posIcon = '🥉'; medallaColor = '#cd7f32'; }

                    html += `
                        <div class="ranking-diario-item" style="display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-bottom: 1px solid #f0f0f0; font-size: 11px;">
                            <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;">
                                <span style="font-weight: 900; min-width: 24px; text-align: center; color: ${medallaColor}; font-size: 12px;">
                                    ${posIcon}
                                </span>
                                <span class="ranking-diario-nombre" style="font-weight: 700; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${item.nombre}">
                                    ${item.nombre}
                                </span>
                            </div>
                            <span class="ranking-diario-valor" style="font-weight: 800; color: #0a3a46; background: #e8f4f8; padding: 2px 8px; border-radius: 12px; font-size: 11px; white-space: nowrap; margin-left: 8px;">
                                ${item.total} ${item.total === 1 ? 'entrevista' : 'entrevistas'}
                            </span>
                        </div>
                    `;
                });

                contenedor.innerHTML = html;

            } catch (err) {
                console.error("Error cargando Top 10 de entrevistas:", err);
                contenedor.innerHTML = `
                    <div class="ranking-diario-vacio" style="padding: 12px; color: #c0392b; font-size: 11px;">
                        No se pudo cargar el ranking del día.
                    </div>
                `;
            }
        }

        async function initApp() {
            await Promise.all([
                cargarListaVendedores(),
                cargarTop10Entrevistas()
            ]);
        }
        
        initApp();
    </script>
</body>

</html>
